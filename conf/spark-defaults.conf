# Spark settings for the test-spark experiment. Used through bin/submit.sh, which also
# puts the jars on the classpath and loads the settings from .env.
# The catalog URI and driver memory are overridden there (REST_PORT/REST_URI, SPARK_DRIVER_MEMORY).

# One JVM per job: in local mode the driver also runs the executors.
spark.master                                            local[*]
spark.driver.memory                                     4g

spark.sql.extensions                                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog                                bench
# Day partitions and timestamp literals in queries are interpreted in UTC, not laptop time.
spark.sql.session.timeZone                              UTC

# REST catalog from docker-compose.yaml. The server owns the warehouse location.
spark.sql.catalog.bench                                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.bench.type                            rest
spark.sql.catalog.bench.uri                             http://localhost:8181

# Every metadata read goes through TimingFileIO (t_fetch), which hands the actual I/O
# to S3FileIO. Data files pass straight through without timing.
spark.sql.catalog.bench.io-impl                         thesis.metabench.TimingFileIO
spark.sql.catalog.bench.metabench.delegate-io-impl      org.apache.iceberg.aws.s3.S3FileIO

# Keep Iceberg's ScanReports in the driver for the job to collect (t_manifests),
# instead of also POSTing them to the REST server.
spark.sql.catalog.bench.metrics-reporter-impl           thesis.metabench.CollectingScanReporter
spark.sql.catalog.bench.rest-metrics-reporting-enabled  false
